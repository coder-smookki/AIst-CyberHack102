name: mobile

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      with_llm:
        description: "Положить в сборку веса языковой модели помощника (около 1 ГБ)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  FLUTTER_VERSION: "3.44.7"
  WITH_LLM: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.with_llm == true }}
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - name: Место на диске
        if: env.WITH_LLM == 'true'
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            mobile/android/*.gradle*
            mobile/android/app/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Память Gradle
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\n' >> ~/.gradle/gradle.properties

      - name: Зависимости
        run: |
          flutter --version
          flutter pub get

      - name: Языковая модель помощника
        timeout-minutes: 20
        run: |
          test -f assets/llm/knowledge_pack.json || { echo "::error::нет mobile/assets/llm/knowledge_pack.json"; exit 1; }
          printf '{"tiers": []}\n' > assets/llm/manifest.json
          if [ "$WITH_LLM" = "true" ]; then
            python3 tool/fetch_llm.py download --repo Qwen/Qwen3-0.6B-GGUF --file Qwen3-0.6B-Q8_0.gguf \
              --id kv-main --title "Основная модель" --min-ram 7000 --min-ios-avail 3000 --context 2048 --snippets 3
            python3 tool/fetch_llm.py download --repo unsloth/Qwen3-0.6B-GGUF --file Qwen3-0.6B-Q4_K_M.gguf \
              --id kv-lite --title "Облегчённая модель" --min-ram 3000 --min-ios-avail 1200 --context 1024 --snippets 1
          fi
          python3 tool/fetch_llm.py list

      - name: Сборка arm64-v8a
        env:
          KST_APP_KEY: ${{ secrets.KST_APP_KEY }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-number "$GITHUB_RUN_NUMBER" --dart-define=KST_APP_KEY="$KST_APP_KEY"

      - name: Сборка universal
        if: env.IS_RELEASE == 'true'
        env:
          KST_APP_KEY: ${{ secrets.KST_APP_KEY }}
        run: |
          flutter build apk --release \
            --build-number "$GITHUB_RUN_NUMBER" --dart-define=KST_APP_KEY="$KST_APP_KEY"

      - name: Файлы сборки
        run: |
          label="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = "tag" ] || label="${GITHUB_SHA:0:7}"
          out=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$out/app-arm64-v8a-release.apk" "dist/kst-vizor-$label-arm64-v8a.apk"
          if [ -f "$out/app-release.apk" ]; then
            cp "$out/app-release.apk" "dist/kst-vizor-$label-universal.apk"
          fi
          (cd dist && sha256sum -- *.apk > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v7
        if: env.IS_RELEASE != 'true'
        with:
          name: kst-vizor-android
          path: mobile/dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: softprops/action-gh-release@v3
        if: env.IS_RELEASE == 'true'
        with:
          files: mobile/dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  ios:
    name: iOS IPA без подписи
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Зависимости
        run: |
          xcodebuild -version
          flutter --version
          flutter pub get

      - name: Языковая модель помощника
        timeout-minutes: 20
        run: |
          test -f assets/llm/knowledge_pack.json || { echo "::error::нет mobile/assets/llm/knowledge_pack.json"; exit 1; }
          printf '{"tiers": []}\n' > assets/llm/manifest.json
          if [ "$WITH_LLM" = "true" ]; then
            python3 tool/fetch_llm.py download --repo Qwen/Qwen3-0.6B-GGUF --file Qwen3-0.6B-Q8_0.gguf \
              --id kv-main --title "Основная модель" --min-ram 7000 --min-ios-avail 3000 --context 2048 --snippets 3
            python3 tool/fetch_llm.py download --repo unsloth/Qwen3-0.6B-GGUF --file Qwen3-0.6B-Q4_K_M.gguf \
              --id kv-lite --title "Облегчённая модель" --min-ram 3000 --min-ios-avail 1200 --context 1024 --snippets 1
          fi
          python3 tool/fetch_llm.py list

      - name: Сборка
        env:
          KST_APP_KEY: ${{ secrets.KST_APP_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER" --dart-define=KST_APP_KEY="$KST_APP_KEY"

      - name: IPA
        run: |
          label="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = "tag" ] || label="${GITHUB_SHA:0:7}"
          rm -rf build/ipa dist
          mkdir -p build/ipa/Payload dist
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry "../../dist/kst-vizor-$label-unsigned.ipa" Payload)
          (cd dist && shasum -a 256 -- *.ipa > SHA256SUMS-ios.txt && cat SHA256SUMS-ios.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v7
        if: env.IS_RELEASE != 'true'
        with:
          name: kst-vizor-ios
          path: mobile/dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: softprops/action-gh-release@v3
        if: env.IS_RELEASE == 'true'
        with:
          files: mobile/dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
