name: quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Изменённые части
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - "server/**"
              - "cv/**"
              - "tests/**"
              - "blender/**"
              - "data/*.json"
              - "models/**"
              - "requirements.txt"
              - "pyproject.toml"
              - ".github/workflows/quality.yml"
            mobile:
              - "mobile/**"
              - ".github/workflows/quality.yml"

  python:
    name: Python - ruff, black, mypy, pytest
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt
          pip install ruff==0.17.5 black==26.10.1 mypy==2.4.1

      - name: Шрифт с кириллицей для PDF
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            || { sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core; }

      - name: ruff
        run: ruff check --output-format=github .

      - name: black
        run: black --check --diff --quiet .

      - name: mypy
        run: mypy

      - name: pytest
        run: python -m pytest -q

  mobile:
    name: Flutter - analyze, test
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.7"
          cache: true
          pub-cache: true

      - name: Зависимости
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
