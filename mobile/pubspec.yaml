name: kst_vizor
description: "КСТ Визор"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  http: ^1.6.0
  image: ^4.13.0
  intl: ^0.20.2
  llamadart: ^0.19.9
  llamadart_llama_cpp_flutter: ^0.19.9
  local_auth: ^3.0.2
  path_parsing: ^1.1.0
  record: ^7.2.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/llm/
  fonts:
    - family: Geologica
      fonts:
        - asset: assets/fonts/Geologica-Light.ttf
          weight: 300
        - asset: assets/fonts/Geologica-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geologica-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geologica-SemiBold.ttf
          weight: 600

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]
            cpu_profile: full
