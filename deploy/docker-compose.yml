name: kst-vizor

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: ./src
      dockerfile: deploy/Dockerfile
    image: kst-vizor-server:latest
    container_name: kst-vizor-app
    restart: unless-stopped
    environment:
      KST_DB: /app/data/runtime/kst.db
      FORWARDED_ALLOW_IPS: "*"
      TZ: Europe/Moscow
      KST_ORT_THREADS: "12"
    volumes:
      - kst-runtime:/app/data/runtime
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4))['ok'] or exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    cpus: "32"
    mem_limit: 8g
    pids_limit: 1024
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - internal

  caddy:
    image: caddy:2.10.2-alpine
    container_name: kst-vizor-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      KST_GATE: ${KST_GATE:?KST_GATE is not set in .env}
      KST_APP_KEY: ${KST_APP_KEY:?KST_APP_KEY is not set in .env}
      TZ: Europe/Moscow
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: "2"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - internal

volumes:
  kst-runtime:
  caddy-data:
  caddy-config:

networks:
  internal:
